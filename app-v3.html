<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Weather Consensus</title><style>:root{--bg:#06111b;--p:#0e2233;--l:#25445d;--t:#f1f8fc;--m:#9bb3c4;--b:#80d0ff;--g:#8de2b3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#123856,transparent 34%),linear-gradient(#071624,#06111b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:860px;margin:auto;padding:18px 12px 60px}header{display:flex;justify-content:space-between;align-items:center}.k{font-size:11px;color:var(--b);font-weight:800;letter-spacing:.14em}.brand{font-size:26px;font-weight:760;margin-top:3px}.btn,.tab{border:1px solid var(--l);background:#ffffff0c;color:#c9dbe7;border-radius:999px;padding:9px 12px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab.active{background:#e0f5ff;color:#07131f;font-weight:700}.hero,.card,.day{background:linear-gradient(160deg,#173b55e8,#0c2030f5);border:1px solid var(--l)}.hero{border-radius:28px;padding:20px}.label{font-size:12px;color:#bad0de}.big{font-size:88px;line-height:.88;font-weight:720;letter-spacing:-.07em;margin:12px 0}.sub{color:var(--m)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:18px}.metric{background:#0002;border:1px solid #ffffff10;border-radius:14px;padding:10px;text-align:center}.metric small{display:block;color:var(--m);font-size:9px}.metric b{display:block;margin-top:4px}.section{margin-top:23px}.head{display:flex;justify-content:space-between;align-items:end;margin:0 3px 9px}.head h2{font-size:17px;margin:0}.head span{color:var(--m);font-size:10px}.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border-radius:18px;padding:13px}.zt{font-size:30px;font-weight:700;margin:4px 0}.hours{display:flex;gap:8px;overflow:auto}.hour{min-width:88px;text-align:center}.hour b{font-size:23px;display:block;margin:6px 0}.days{border-radius:20px;overflow:hidden;border:1px solid var(--l)}.day{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:13px;border:0;border-bottom:1px solid var(--l)}.day:last-child{border-bottom:0}.models{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.model{display:grid;grid-template-columns:1fr auto}.model small{color:var(--m)}.warn{display:none;margin-top:10px;color:#ffd3d3}.foot{color:#6f8b9d;font-size:10px;margin-top:18px}@media(max-width:600px){.big{font-size:82px}.metrics{grid-template-columns:repeat(2,1fr)}.zones,.models{grid-template-columns:1fr}}</style></head><body><div class="app"><header><div><div id="kicker" class="k">HRM CORE</div><div class="brand">Weather Consensus</div></div><button id="refresh" class="btn">Refresh</button></header><div id="tabs" class="tabs"></div><div id="warn" class="warn"></div><section class="hero"><div id="place" class="label">Halifax Peninsula · Bedford · Dartmouth</div><div id="feel" class="big">--°</div><div id="summary" class="sub">Building feels-like consensus…</div><div class="metrics"><div class="metric"><small>ACTUAL</small><b id="actual">--°</b></div><div class="metric"><small>FEELS HIGH</small><b id="fhigh">--°</b></div><div class="metric"><small>RAIN</small><b id="rain">--%</b></div><div class="metric"><small>WIND</small><b id="wind">--</b></div></div></section><section class="section"><div class="head"><h2 id="zoneTitle">Across HRM</h2><span>feels-like first</span></div><div id="zones" class="zones"></div></section><section class="section"><div class="head"><h2>Next 12 hours</h2><span>actual below</span></div><div id="hours" class="hours"></div></section><section class="section"><div class="head"><h2>7-day outlook</h2><span>high / low / rain</span></div><div id="days" class="days"></div></section><section class="section"><div class="head"><h2>Model consensus</h2><span id="modelCount">connecting…</span></div><div id="models" class="models"></div></section><div id="updated" class="foot"></div></div><script>const L={hrm:{n:'HRM Core',k:'HRM CORE',s:'Halifax Peninsula · Bedford · Dartmouth',z:[['Halifax Peninsula',44.6488,-63.5752],['Bedford',44.7318,-63.6619],['Dartmouth',44.6661,-63.5676]]},moncton:{n:'Moncton',k:'MONCTON NB',s:'Downtown Moncton',z:[['Moncton',46.0878,-64.7782]]},shediac:{n:'Shediac',k:'SHEDIAC NB',s:'Shediac town centre',z:[['Shediac',46.2198,-64.5411]]}};const M=[['gem_hrdps_continental','HRDPS','ECCC'],['gem_regional','GEM Regional','ECCC'],['gem_seamless','GEM','ECCC'],['ecmwf_ifs025','ECMWF IFS','ECMWF'],['ecmwf_aifs025_single','ECMWF AIFS','ECMWF AI'],['gfs_seamless','GFS','NOAA'],['icon_seamless','ICON','DWD'],['ukmo_seamless','UKMO','UK Met'],['jma_seamless','JMA','Japan'],['kma_seamless','KMA','Korea'],['meteofrance_seamless','Météo-France','France'],['bom_access_global','ACCESS-G','BOM'],['cma_grapes_global','GRAPES','CMA']];let loc='hrm',token=0;const av=a=>{a=a.filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null},f=(x,d=1)=>Number.isFinite(x)?x.toFixed(d):'--';function idx(d){let n=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Halifax',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).format(new Date()).replace(' ','T').slice(0,13),i=d.hourly.time.findIndex(t=>t.slice(0,13)>=n);return i<0?0:i}function nav(){tabs.innerHTML=Object.entries(L).map(([k,v])=>`<button class="tab ${k===loc?'active':''}" data-k="${k}">${v.n}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{loc=b.dataset.k;nav();load()})}async function q(z,m){let best=!m,p=new URLSearchParams({latitude:z[1],longitude:z[2],timezone:'America/Halifax',forecast_days:7,temperature_unit:'celsius',wind_speed_unit:'kmh',current:best?'temperature_2m,apparent_temperature,wind_speed_10m':'temperature_2m',hourly:best?'temperature_2m,apparent_temperature,precipitation_probability':'temperature_2m',daily:'temperature_2m_max,temperature_2m_min'});if(m)p.set('models',m[0]);let c=new AbortController(),t=setTimeout(()=>c.abort(),6500);try{let r=await fetch('https://api.open-meteo.com/v1/forecast?'+p,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error(r.status);return{z,m,d:await r.json()}}finally{clearTimeout(t)}}function render(best,mods,loading){let C=L[loc],zs=C.z.map(z=>{let b=best.find(x=>x.z[0]===z[0]),a=mods.filter(x=>x.z[0]===z[0]),i=b?idx(b.d):0,temps=a.map(x=>x.d.current?.temperature_2m);return{z,b,a,t:av(temps.length?temps:[b?.d.current?.temperature_2m]),fl:b?.d.current?.apparent_temperature,fh:b?Math.max(...b.d.hourly.apparent_temperature.slice(i,i+12).filter(Number.isFinite)):null,r:b?.d.hourly.precipitation_probability?.[i],w:b?.d.current?.wind_speed_10m}});let T=av(zs.map(x=>x.t)),F=av(zs.map(x=>x.fl));kicker.textContent=C.k;place.textContent=C.s;zoneTitle.textContent=C.z.length>1?'Across HRM':C.n;feel.textContent=f(F)+'°';actual.textContent=f(T)+'°';fhigh.textContent=f(av(zs.map(x=>x.fh)))+'°';rain.textContent=f(av(zs.map(x=>x.r)),0)+'%';wind.textContent=f(av(zs.map(x=>x.w)),0)+' km/h';summary.textContent=`Feels like now · actual ${f(T)}°${loading?' · loading models':''}`;zones.innerHTML=zs.map(x=>`<div class="card"><small>${x.z[0]}</small><div class="zt">${f(x.fl)}°</div><div class="sub">actual ${f(x.t)}° · ${x.a.length} models</div></div>`).join('');let b=best[0]?.d;if(b){let s=idx(b);hours.innerHTML=b.hourly.time.slice(s,s+12).map((t,i)=>`<div class="card hour"><small>${new Intl.DateTimeFormat('en-CA',{hour:'numeric',timeZone:'America/Halifax'}).format(new Date(t+':00-03:00'))}</small><b>${f(av(zs.map(x=>x.b?.d.hourly.apparent_temperature?.[s+i])),0)}°</b><div class="sub">air ${f(av(zs.map(x=>x.b?.d.hourly.temperature_2m?.[s+i])),0)}°</div><small>☂ ${f(b.hourly.precipitation_probability?.[s+i],0)}%</small></div>`).join('');days.innerHTML=b.daily.time.slice(0,7).map((d,i)=>`<div class="day"><b>${new Intl.DateTimeFormat('en-CA',{weekday:'short',timeZone:'America/Halifax'}).format(new Date(d+'T12:00:00-03:00'))}</b><span>☂ --</span><span><b>${f(av(zs.map(x=>x.b?.d.daily.temperature_2m_max?.[i])),0)}°</b> <span class="sub">${f(av(zs.map(x=>x.b?.d.daily.temperature_2m_min?.[i])),0)}°</span></span></div>`).join('')}let rows=M.map(m=>{let a=mods.filter(x=>x.m?.[0]===m[0]);return a.length?[m,av(a.map(x=>x.d.current?.temperature_2m)),a.length]:null}).filter(Boolean);modelCount.textContent=`${rows.length} models · ${mods.length} feeds`;models.innerHTML=rows.map(x=>`<div class="card model"><div><b>${x[0][1]}</b><br><small>${x[0][2]} · ${x[2]}/${C.z.length}</small></div><b>${f(x[1])}°</b></div>`).join('');updated.textContent=`Updated ${new Intl.DateTimeFormat('en-CA',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Halifax'}).format(new Date())}. Feels-like is primary. Environment Canada alerts remain authoritative.`}async function load(){let my=++token,C=L[loc];refresh.disabled=true;warn.style.display='none';let B=await Promise.allSettled(C.z.map(z=>q(z))),best=B.filter(x=>x.status==='fulfilled').map(x=>x.value);if(my!==token)return;if(best.length)render(best,[],true);let tasks=[];for(let m of M)for(let z of C.z)tasks.push(q(z,m));let R=await Promise.allSettled(tasks),mods=R.filter(x=>x.status==='fulfilled').map(x=>x.value);if(my!==token)return;if(best.length||mods.length)render(best,mods,false);else{warn.style.display='block';warn.textContent='No live feeds responded.'}refresh.disabled=false}refresh.onclick=load;nav();load();</script></body></html>
