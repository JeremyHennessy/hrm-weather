name: Validate app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check v5b.js
          node --check v6-extra.js
          node --check v7-final.js
      - name: Python syntax
        run: |
          python -m py_compile scripts/collect.py
          python -m py_compile scripts/backfill_short.py
      - name: Validate JSON
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool data/skill.json >/dev/null
          python -m json.tool data/ledger.json >/dev/null
      - name: Verify app references
        run: |
          grep -q 'v5b.js' app-v6.html
          grep -q 'v6-extra.js' app-v6.html
          grep -q 'v7-final.js' app-v6.html
          grep -q 'app-v6.html' index.html
