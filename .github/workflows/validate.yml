name: Validate app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check request-manager.js
          node --check v5b.js
          node --check v6-extra.js
          node --check v7-final.js
          node --check startup-fallback.js
          node --check v8-ui.js
          node --check v11-layout.js
          node --check scene-images.js
          node --check accuracy-v2.js
          node --check accuracy-v3.js
          node --check atomic-render.js
          node --check daily-card-fix.js
          node --check deep-ui.js
          node --check sw.js
          node --check scripts/capture-ui.mjs
          node --check scripts/smoke-live.mjs
      - name: Python syntax
        run: |
          python -m py_compile scripts/collect.py
          python -m py_compile scripts/accuracy_engine_v2.py
          python -m py_compile scripts/accuracy_engine_v2_runner.py
          python -m py_compile scripts/accuracy_engine_v3.py
          python -m py_compile scripts/accuracy_engine_v3_pooling.py
          python -m py_compile scripts/accuracy_engine_v3_publish.py
          python -m py_compile scripts/eccc_observation_mesh_v2.py
          python -m py_compile scripts/backfill_short.py
      - name: Validate JSON
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool data/skill.json >/dev/null
          python -m json.tool data/ledger.json >/dev/null
          python -m json.tool data/engine-v2.json >/dev/null
          test -f data/engine-v3.json && python -m json.tool data/engine-v3.json >/dev/null || true
      - name: Verify Engine 3 architecture
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import accuracy_engine_v3 as v3
          import accuracy_engine_v3_pooling as pooling
          assert len(v3.FAMILIES) >= 6
          assert callable(v3.fit_mos)
          assert callable(v3.analog_predict)
          assert callable(v3.observation_nudge)
          assert callable(v3.calibrate_probability)
          assert pooling.nearby_leads(3) == {1,3,6}
          print('Accuracy Engine 3.0 architecture imports successfully')
          PY
      - name: Verify app references and mobile shell
        run: |
          grep -q 'viewport-fit=cover' app.html
          grep -q 'startup-fallback.js' app.html
          grep -q 'request-manager.js' app.html
          grep -q 'v5b.js' app.html
          grep -q 'v6-extra.js' app.html
          grep -q 'v7-final.js' app.html
          grep -q 'v8-ui.js' app.html
          grep -q 'v11-reference.css' app.html
          grep -q 'v11-layout.js' app.html
          grep -q 'installStableRenderer' request-manager.js
          grep -q '__wxAtomicRenderInstalled' request-manager.js
          grep -q 'requestKind' request-manager.js
          grep -q 'api.weather.gc.ca' request-manager.js
          grep -q "kind==='eccc'?4000:10000" request-manager.js
          ! grep -q 'document.write' request-manager.js
          grep -q 'wx-engine-v3-startup' startup-fallback.js
          grep -q 'accuracy-v2.js' scene-images.js
          grep -q 'accuracy-v3.js' deep-ui.js
          grep -q 'daily-card-fix.js' deep-ui.js
          grep -q 'accuracy-v3.js' sw.js
          grep -q 'daily-card-fix.js' sw.js
          grep -q 'weather-consensus-v48' sw.js
          grep -q 'startup-fallback.js' sw.js
          grep -q '__wxPaintStaticStartup' v7-final.js
          grep -q 'Same-origin static startup path' v7-final.js
          grep -q '__wxStaticStartupShown' startup-fallback.js
          grep -q 'data/engine-v3.json' startup-fallback.js
          grep -q 'accuracy_engine_v2_runner' scripts/collect.py
          grep -q 'accuracy_engine_v3_publish' scripts/collect.py
          grep -q 'eccc_observation_mesh_v2' scripts/collect.py
          grep -q 'v11RainPct' daily-card-fix.js
          grep -q 'Real Feel' app.html
          grep -q 'morningRoutine' app.html
          grep -q 'eveningRoutine' app.html
          grep -q 'app.html' index.html
          grep -q 'safe-area-inset-top' v7-final.js
          grep -q 'safe-area-inset-bottom' v7-final.js
          grep -q "L.lunenburg" v7-final.js
          grep -q "L.wolfville" v7-final.js
          grep -q 'v11-layout.js' sw.js
          test -f startup-fallback.js
          test -f icons/apple-touch-icon.png
          test -f icons/icon-192.png
          test -f icons/icon-512.png
