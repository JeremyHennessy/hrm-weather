name: Collect weather skill

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - '.github/workflows/collect-weather.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-skill-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and verify forecasts
        run: python scripts/collect.py
      - name: Verify stale observations are rejected
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          d=json.loads(Path('data/skill.json').read_text())
          now=datetime.now(timezone.utc)
          for name,obs in (d.get('observations') or {}).items():
              if not obs:
                  continue
              stamp=obs.get('time')
              if not stamp:
                  raise SystemExit(f'{name}: observation missing timestamp')
              dt=datetime.fromisoformat(stamp.replace('Z','+00:00'))
              if now-dt > timedelta(hours=6):
                  raise SystemExit(f'{name}: stale observation {stamp}')
          print('Observation freshness check passed')
          PY
      - name: Commit updated skill data
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skill.json data/ledger.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update hourly forecast skill data"
            git push
          fi
