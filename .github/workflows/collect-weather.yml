name: Collect weather skill

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - 'scripts/accuracy_engine_v2.py'
      - 'scripts/accuracy_engine_v2_runner.py'
      - 'scripts/accuracy_engine_v3.py'
      - 'scripts/accuracy_engine_v3_pooling.py'
      - 'scripts/accuracy_engine_v3_verify.py'
      - 'scripts/accuracy_engine_v3_walkforward.py'
      - 'scripts/accuracy_engine_v3_publish.py'
      - 'scripts/real_feel_engine.py'
      - 'scripts/eccc_observation_mesh_v2.py'
      - '.github/workflows/collect-weather.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate collector syntax
        run: python -m py_compile scripts/collect.py scripts/accuracy_engine_v2.py scripts/accuracy_engine_v2_runner.py scripts/accuracy_engine_v3.py scripts/accuracy_engine_v3_pooling.py scripts/accuracy_engine_v3_verify.py scripts/accuracy_engine_v3_walkforward.py scripts/accuracy_engine_v3_publish.py scripts/real_feel_engine.py scripts/eccc_observation_mesh_v2.py
      - name: Collect and verify forecasts
        env:
          WX_COLLECT_WORKERS: '16'
          PIRATE_WEATHER_API_KEY: ${{ secrets.PIRATE_WEATHER_API_KEY }}
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: python scripts/collect.py
      - name: Validate Accuracy Engine outputs
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          skill=json.loads(Path('data/skill.json').read_text())
          v2=json.loads(Path('data/engine-v2.json').read_text())
          v3=json.loads(Path('data/engine-v3.json').read_text())
          shadow=json.loads(Path('data/v3-verification.json').read_text())
          now=datetime.now(timezone.utc)

          assert v2.get('version') == '2.0', 'wrong V2 version'
          assert v3.get('version') == '3.0', 'wrong V3 version'
          assert shadow.get('version') == '1.0', 'wrong V3 shadow verification version'
          a2=v2.get('architecture') or {}
          assert a2.get('family_aware_weighting') is True
          assert a2.get('bias_correction') is True
          assert a2.get('run_stability') is True
          assert a2.get('parallel_collection') is True
          a3=v3.get('architecture') or {}
          layers=' '.join(a3.get('layers') or []).lower()
          for required in ['mos','analog','observation','probability']:
              if required not in layers:
                  raise SystemExit(f'V3 missing {required} layer')
          if not (v3.get('collector') or {}).get('lead_pooling'):
              raise SystemExit('V3 pooled training is not enabled')
          verification=v3.get('verification') or {}
          if verification.get('mode') != 'prospective-shadow-out-of-sample':
              raise SystemExit('V3 prospective shadow verification not active')
          if verification.get('minimum_samples_before_adaptation',0) < 5:
              raise SystemExit('V3 adaptive weighting threshold is too low')
          walk=v3.get('walk_forward_verification') or {}
          if walk.get('mode') != 'historical-walk-forward':
              raise SystemExit('historical walk-forward verification missing')
          if walk.get('leakage_policy') != 'strictly-earlier-targets-only':
              raise SystemExit('walk-forward leakage guard missing')
          real=v3.get('real_feel') or {}
          if real.get('forecast_points_ready',0) < len(v3.get('consensus') or {}):
              raise SystemExit('locally calibrated Real Feel did not publish enough forecast points')

          observations=skill.get('observations') or {}
          hrm=observations.get('hrm')
          if not hrm or not isinstance(hrm.get('temp'), (int,float)):
              raise SystemExit('HRM ECCC observation mesh unavailable')
          if hrm.get('station_count',0) < 1:
              raise SystemExit('HRM ECCC observation mesh contains no stations')
          for name,obs in observations.items():
              if not obs: continue
              stamp=obs.get('time')
              if not stamp: raise SystemExit(f'{name}: observation missing timestamp')
              dt=datetime.fromisoformat(stamp.replace('Z','+00:00'))
              if now-dt > timedelta(hours=6): raise SystemExit(f'{name}: stale observation {stamp}')

          for name,c in (v3.get('consensus') or {}).items():
              hours=c.get('hours') or {}
              if not hours: raise SystemExit(f'{name}: missing V3 consensus hours')
              h1=hours.get('1') or {}
              if not isinstance(h1.get('temperature_2m'), (int,float)):
                  raise SystemExit(f'{name}: missing V3 +1h temperature')
              if not isinstance(h1.get('real_feel'), (int,float)):
                  raise SystemExit(f'{name}: missing calibrated V3 +1h Real Feel')
              rf=h1.get('real_feel_engine') or {}
              if rf.get('method') != 'physics-plus-local-verified-residual':
                  raise SystemExit(f'{name}: Real Feel engine metadata missing')
              if 'adaptive_skill' not in h1:
                  raise SystemExit(f'{name}: missing adaptive skill diagnostics')
              pop=(hours.get('6') or {}).get('precipitation_probability')
              if pop is not None and not (0 <= pop <= 100):
                  raise SystemExit(f'{name}: invalid calibrated precipitation probability {pop}')

          health=v2.get('source_health') or {}
          if not health: raise SystemExit('missing source health diagnostics')
          for name,h in health.items():
              if h.get('deterministic_models',0) < 3:
                  raise SystemExit(f'{name}: insufficient deterministic model coverage: {h}')
          print('Accuracy Engines 2.0 + 3.0 + walk-forward + calibrated Real Feel production validation passed')
          PY
      - name: Commit updated skill data
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skill.json data/ledger.json data/engine-v2.json data/engine-v3.json data/v3-verification.json data/run-history-v2.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update hourly forecast skill data"
            git pull --rebase origin main
            git push
          fi
