name: Collect weather skill

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - 'scripts/accuracy_engine_v2.py'
      - 'scripts/accuracy_engine_v2_runner.py'
      - 'scripts/eccc_observation_mesh_v2.py'
      - '.github/workflows/collect-weather.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate collector syntax
        run: python -m py_compile scripts/collect.py scripts/accuracy_engine_v2.py scripts/accuracy_engine_v2_runner.py scripts/eccc_observation_mesh_v2.py
      - name: Collect and verify forecasts
        env:
          WX_COLLECT_WORKERS: '16'
          PIRATE_WEATHER_API_KEY: ${{ secrets.PIRATE_WEATHER_API_KEY }}
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: python scripts/collect.py
      - name: Validate Accuracy Engine 2.0 output
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          skill=json.loads(Path('data/skill.json').read_text())
          engine=json.loads(Path('data/engine-v2.json').read_text())
          now=datetime.now(timezone.utc)

          assert engine.get('version') == '2.0', 'wrong engine version'
          arch=engine.get('architecture') or {}
          assert arch.get('family_aware_weighting') is True
          assert arch.get('bias_correction') is True
          assert arch.get('run_stability') is True
          assert arch.get('parallel_collection') is True
          assert {'nowcast','learned_local','raw_ensemble'} <= set(arch.get('engines') or [])

          observations=skill.get('observations') or {}
          hrm=observations.get('hrm')
          if not hrm or not isinstance(hrm.get('temp'), (int,float)):
              raise SystemExit('HRM ECCC observation mesh unavailable')
          if hrm.get('station_count',0) < 1:
              raise SystemExit('HRM ECCC observation mesh contains no stations')

          for name,obs in observations.items():
              if not obs:
                  continue
              stamp=obs.get('time')
              if not stamp:
                  raise SystemExit(f'{name}: observation missing timestamp')
              dt=datetime.fromisoformat(stamp.replace('Z','+00:00'))
              if now-dt > timedelta(hours=6):
                  raise SystemExit(f'{name}: stale observation {stamp}')

          for name,c in (engine.get('consensus') or {}).items():
              if not (c.get('hours') or {}):
                  raise SystemExit(f'{name}: missing v2 consensus hours')
          if not isinstance((engine.get('consensus') or {}).get('hrm',{}).get('hours',{}).get('1',{}).get('components',{}).get('nowcast'), (int,float)):
              raise SystemExit('HRM +1h nowcast component is not observation-anchored')

          health=engine.get('source_health') or {}
          if not health:
              raise SystemExit('missing source health diagnostics')
          for name,h in health.items():
              if h.get('deterministic_models',0) < 3:
                  raise SystemExit(f'{name}: insufficient deterministic model coverage: {h}')

          print('Accuracy Engine 2.0 production validation passed')
          PY
      - name: Commit updated skill data
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skill.json data/ledger.json data/engine-v2.json data/run-history-v2.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update hourly forecast skill data"
            git pull --rebase origin main
            git push
          fi
