name: Collect weather skill

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-skill-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and verify forecasts
        run: python scripts/collect.py
      - name: Commit updated skill data
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skill.json data/ledger.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update hourly forecast skill data"
            git push
          fi
