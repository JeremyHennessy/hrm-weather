name: Collect weather skill

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/collect-weather.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Install RRFS GRIB reader
        run: python -m pip install --quiet eccodes
      - name: Validate collector syntax
        run: |
          python -m py_compile \
            scripts/collect.py scripts/accuracy_engine_v2.py scripts/accuracy_engine_v2_runner.py \
            scripts/accuracy_engine_v3.py scripts/accuracy_engine_v3_pooling.py \
            scripts/accuracy_engine_v3_verify.py scripts/accuracy_engine_v3_walkforward.py \
            scripts/precipitation_walkforward.py scripts/precip_nowcast_verifier.py scripts/forecast_confidence_engine.py \
            scripts/accuracy_engine_v3_publish.py scripts/engine3_champion_gate.py \
            scripts/engine3_weighting.py scripts/real_feel_engine.py \
            scripts/eccc_observation_mesh_v2.py scripts/location_uws.py scripts/uws_model_independence.py scripts/solar_context_v2.py \
            scripts/engine31_policy.py scripts/engine31_install.py scripts/rain_timing_verifier.py \
            scripts/engine32_family_benchmark.py scripts/engine32_family_taxonomy.py \
            scripts/rrfsv1_shadow.py scripts/rrfsv1_runtime.py
      - name: Collect and verify forecasts
        env:
          WX_COLLECT_WORKERS: '16'
          PIRATE_WEATHER_API_KEY: ${{ secrets.PIRATE_WEATHER_API_KEY }}
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: python scripts/collect.py
      - name: Validate Accuracy Engine outputs
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          skill=json.loads(Path('data/skill.json').read_text())
          v2=json.loads(Path('data/engine-v2.json').read_text())
          v3=json.loads(Path('data/engine-v3.json').read_text())
          shadow=json.loads(Path('data/v3-verification.json').read_text())
          precip06_state=json.loads(Path('data/precip-nowcast-verification.json').read_text())
          rrfs_state=json.loads(Path('data/rrfsv1-verification.json').read_text())
          now=datetime.now(timezone.utc)

          assert v2.get('version') == '2.0'
          assert v3.get('version') == '3.0'
          assert shadow.get('version') == '2.0'
          assert precip06_state.get('version') == '2.0'
          assert rrfs_state.get('version') == '1.0'
          assert 'real_feel_reference_scores' in shadow
          assert 'confidence_scores' in shadow

          # Upper West Side is first-class server forecast state, not a client-only tab.
          assert 'uws' in (v2.get('consensus') or {}), 'UWS missing from Engine 2 consensus'
          assert 'uws' in (v3.get('consensus') or {}), 'UWS missing from Engine 3 consensus'
          model_sets=v2.get('location_model_sets') or {}
          assert 'ncep_hrrr_conus' in (model_sets.get('uws') or []), model_sets.get('uws')
          for ca in ('hrm','moncton','shediac','lunenburg','wolfville'):
              assert 'ncep_hrrr_conus' not in (model_sets.get(ca) or []), f'{ca}: HRRR leaked into Canadian model set'
          uhealth=(v2.get('source_health') or {}).get('uws') or {}
          assert uhealth.get('deterministic_expected',0) >= 10, uhealth
          uobs=(skill.get('observations') or {}).get('uws')
          if uobs:
              assert uobs.get('provider') == 'NWS', uobs
              assert uobs.get('official_station') == 'KNYC', uobs
              assert uobs.get('station_count',0) >= 1, uobs

          walk=v3.get('walk_forward_verification') or {}
          assert walk.get('mode') == 'historical-walk-forward'
          assert walk.get('leakage_policy') == 'strictly-earlier-targets-only'
          pwalk=v3.get('precipitation_walk_forward') or {}
          assert pwalk.get('mode') == 'historical-walk-forward-probability'
          assert pwalk.get('leakage_policy') == 'strictly-earlier-targets-only'
          assert pwalk.get('evaluated_targets',0) >= 1

          precip06=v3.get('precipitation_nowcast_verification') or {}
          assert precip06.get('version') == '2.0', precip06
          assert precip06.get('lead_grid_hours') == [0,1,2,3,4,5,6], precip06
          assert precip06.get('mode') == 'prospective-hourly-0-6-model-plus-radar-vs-official-gauge-radar-rdpa', precip06
          assert 'Brier' in (precip06.get('calibration_policy') or '') or 'brier' in (precip06.get('calibration_policy') or '').lower()
          timing=v3.get('rain_timing_verification') or {}
          assert timing.get('owner') == 'precip-nowcast-verifier', timing
          assert timing.get('lead_grid_hours') == [0,1,2,3,4,5,6], timing

          rrfs=v3.get('rrfsv1') or {}
          assert rrfs.get('version') == '1.0', rrfs
          assert rrfs.get('status') == 'prospective-shadow-only', rrfs
          assert rrfs.get('lead_hours') == [1,3,6,12,24], rrfs
          assert set(rrfs.get('variables') or []) == {'temperature_2m','precipitation','wind_gusts_10m','cloud_cover'}, rrfs
          assert rrfs.get('applied_production_weight') == 0.0, rrfs
          assert rrfs.get('production_changed') is False, rrfs
          assert (rrfs.get('promotion_policy') or {}).get('automatic_promotion') is False, rrfs
          assert 'WeatherNext 2' in (rrfs.get('next_ensemble_candidate') or ''), rrfs

          conf=v3.get('forecast_confidence') or {}
          assert conf.get('version') == '2.0'
          assert conf.get('owner') == 'accuracy-engine-3'
          real=v3.get('real_feel') or {}
          assert real.get('version') == '2.0'
          assert real.get('forecast_points_ready',0) >= len(v3.get('consensus') or {})
          assert real.get('formula_validation') == 'comparative independent references; no synthetic single observed Real Feel target'
          replay=v3.get('real_feel_formula_replay') or {}
          assert replay.get('mode') == 'comparative-independent-reference-replay'

          e31=v3.get('engine31') or {}
          assert e31.get('version') == '3.1-challenger'
          assert e31.get('status') == 'shadow-with-automatic-evidence-gated-promotion'
          assert e31.get('model_set_watch',{}).get('fingerprint')
          assert 'safety_fallbacks' in e31
          e32=v3.get('engine32') or {}
          assert e32.get('version') == '3.2-family-taxonomy-challenger', e32
          assert e32.get('status') == 'historical-winner-prospective-shadow', e32
          assert e32.get('selected_taxonomy') == '8-family', e32
          assert e32.get('production_replacement') is False and e32.get('automatic_promotion') is False, e32
          assert e32.get('forecast_points_ready',0) >= len(v3.get('consensus') or {}), e32
          hist=e32.get('historical_benchmark') or {}
          assert hist.get('ledger_rows') == 50394 and hist.get('paired_cases') == 443, hist
          assert hist.get('historical_winner') == '8-family', hist
          tax=e32.get('taxonomies') or {}
          assert len(tax.get('8-family') or []) == 8 and len(tax.get('10-family') or []) == 10, tax
          assert {'kma','bom','cma'}.issubset(set(tax.get('10-family') or [])), tax
          assert any('engine32_family' in (r.get('temperature_candidates') or {}) for r in shadow.get('forecasts',[])), 'Engine 3.2 candidate missing from prospective verifier'
          assert 'nowcast_intelligence' in v3 and 'microclimate_intelligence' in v3

          # Official observations improve the current correction/nudge, but a
          # transient government-station outage must not discard an otherwise
          # healthy hourly forecast publication. Halifax remains the primary
          # default and is still held to a stronger model-coverage floor.
          observations=skill.get('observations') or {}
          hrm=observations.get('hrm')
          hrm_health=(v2.get('source_health') or {}).get('hrm') or {}
          if hrm:
              assert isinstance(hrm.get('temp'), (int,float)), hrm
              assert hrm.get('station_count',0) >= 1, hrm
              assert hrm.get('wind_station_count',0) >= 1, hrm
          else:
              assert hrm_health.get('observation_stations',0) == 0, hrm_health
              assert hrm_health.get('deterministic_models',0) >= 10, hrm_health
              assert hrm_health.get('deterministic_expected',0) >= 13, hrm_health
          for name,obs in observations.items():
              if not obs: continue
              stamp=obs.get('time')
              assert stamp, f'{name}: missing observation time'
              dt=datetime.fromisoformat(stamp.replace('Z','+00:00'))
              assert now-dt <= timedelta(hours=6), f'{name}: stale observation'

          truth=v3.get('server_truth') or {}
          assert truth.get('version') == '1.0'
          assert truth.get('owner') == 'hourly-server-collector'
          for key in ('hrm','uws'):
              assert (truth.get('source_health') or {}).get(key) == (v2.get('source_health') or {}).get(key)
              assert (truth.get('observations') or {}).get(key) == (v2.get('observations') or {}).get(key)
              assert (truth.get('best_models') or {}).get(key) == (v2.get('best_models') or {}).get(key)
          hctx=((truth.get('consensus_context') or {}).get('hrm') or {}).get('1') or {}
          assert 'learned_spread' in hctx and 'uncertainty' in hctx and 'effective_independent_sources' in hctx

          fresh_models=(v3.get('collector') or {}).get('deterministic_forecasts',0)
          shadow_degraded=[]
          for name,c in (v3.get('consensus') or {}).items():
              h1=(c.get('hours') or {}).get('1') or {}
              assert isinstance(h1.get('temperature_2m'), (int,float)), f'{name}: missing V3 temp'
              assert isinstance(h1.get('real_feel'), (int,float)), f'{name}: missing Real Feel'
              assert h1.get('real_feel_source') in {'provider-apparent-champion','steadman-fallback','local-calibrated-last-resort'}, f'{name}: invalid Real Feel source'
              assert 'engine31_challenger' in h1
              assert 'engine32_family_challenger' in h1, f'{name}: Engine 3.2 shadow state missing'
              e32c=h1.get('engine32_family_challenger') or {}
              assert e32c.get('taxonomy') == '8-family', f'{name}: invalid Engine 3.2 taxonomy'
              if e32c.get('available') is True:
                  assert isinstance(e32c.get('temperature_2m'), (int,float)), f'{name}: invalid Engine 3.2 temp'
                  assert e32c.get('role') == 'prospective-shadow-only', e32c
              else:
                  reason=e32c.get('reason')
                  assert reason in {'missing-target','insufficient-current-families','no-temperature-components'}, f'{name}: undeclared Engine 3.2 degradation: {e32c}'
                  shadow_degraded.append(f'{name}:{reason}')
              fc=h1.get('forecast_confidence') or {}
              assert isinstance(fc.get('value'), (int,float)) and 50 <= fc['value'] <= 96, f'{name}: invalid confidence'
              rf=h1.get('real_feel_engine') or {}
              assert rf.get('method') == 'provider-apparent-production-with-steadman-fallback-and-local-shadow'
              assert rf.get('local_calibration_role') == 'shadow-only'
              inputs=rf.get('inputs') or {}
              if fresh_models > 0:
                  assert inputs.get('cloud_cover') is not None, f'{name}: cloud missing with live models'

          health=v2.get('source_health') or {}
          assert health
          degraded_text=','.join(shadow_degraded) if shadow_degraded else 'none'
          print(f"Engine 2/3/3.1/3.2 + UWS + precip0-6 + RRFS validation passed; fresh deterministic feeds={fresh_models}; HRM obs stations={hrm_health.get('observation_stations')}; UWS models={uhealth.get('deterministic_models')}/{uhealth.get('deterministic_expected')}; precip rows={precip06.get('rows')}; RRFS rows={rrfs.get('archived_rows')}; Engine 3.2 shadow degraded={degraded_text}; production RRFS weight=0")
          PY
      - name: Commit updated skill data
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skill.json data/ledger.json data/engine-v2.json data/engine-v3.json data/v3-verification.json data/run-history-v2.json data/model-set-state.json data/precip-nowcast-verification.json data/rrfsv1-verification.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update hourly forecast skill data"
            git pull --rebase origin main
            git push
          fi
