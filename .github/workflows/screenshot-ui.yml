name: Capture live UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'v4.css'
      - 'v11-reference.css'
      - 'request-manager.js'
      - 'v5b.js'
      - 'v6-extra.js'
      - 'v7-final.js'
      - 'v8-ui.js'
      - 'v11-layout.js'
      - 'scene-images.js'
      - 'deep-ui.js'
      - 'deep-ui.css'
      - 'accuracy-v2.js'
      - 'accuracy-v3.js'
      - 'atomic-render.js'
      - 'daily-card-fix.js'
      - 'forecast-confidence.js'
      - 'forecast-ui-guard.js'
      - 'forecast-insights.js'
      - 'uv-guidance.js'
      - 'weather-icons.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'scripts/capture-ui.mjs'
      - 'scripts/smoke-live.mjs'
      - 'scripts/layout-qa.mjs'
      - '.github/workflows/screenshot-ui.yml'

permissions:
  contents: read

concurrency:
  group: weather-ui-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Wait for current release on GitHub Pages
        run: |
          EXPECTED=$(grep -o "weather-consensus-v[0-9]*" sw.js | head -1)
          echo "Waiting for live release: $EXPECTED"
          for i in $(seq 1 48); do
            LIVE=$(curl -fsS "https://jeremyhennessy.github.io/hrm-weather/sw.js?qa=$(date +%s)" || true)
            if echo "$LIVE" | grep -q "$EXPECTED"; then
              echo "GitHub Pages is serving $EXPECTED"
              exit 0
            fi
            echo "Attempt $i: live site has not reached $EXPECTED yet"
            sleep 5
          done
          echo "Timed out waiting for GitHub Pages to serve $EXPECTED"
          exit 1
      - name: Verify live mobile startup
        run: node scripts/smoke-live.mjs
      - name: Check responsive UI across phone sizes
        run: node scripts/layout-qa.mjs
      - name: Capture current main with live weather APIs
        run: node scripts/capture-ui.mjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 7