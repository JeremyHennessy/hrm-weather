name: Capture live UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'v4.css'
      - 'v11-reference.css'
      - 'v5b.js'
      - 'v6-extra.js'
      - 'v7-final.js'
      - 'v8-ui.js'
      - 'v11-layout.js'
      - 'scene-images.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'scripts/capture-ui.mjs'
      - '.github/workflows/screenshot-ui.yml'

permissions:
  contents: read

concurrency:
  group: weather-ui-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Capture current main with live weather APIs
        run: node scripts/capture-ui.mjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 7
