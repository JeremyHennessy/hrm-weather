name: Capture live UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'ny.html'
      - 'us-units.js'
      - 'v4.css'
      - 'v11-reference.css'
      - 'request-manager.js'
      - 'v5b.js'
      - 'v6-extra.js'
      - 'v7-final.js'
      - 'uws-location-ui.js'
      - 'v8-ui.js'
      - 'v11-layout.js'
      - 'scene-images.js'
      - 'deep-ui.js'
      - 'deep-ui.css'
      - 'accuracy-v2.js'
      - 'accuracy-v3.js'
      - 'server-truth-ui.js'
      - 'atomic-render.js'
      - 'daily-card-fix.js'
      - 'daily-detail.js'
      - 'forecast-confidence.js'
      - 'forecast-ui-guard.js'
      - 'forecast-insights.js'
      - 'uv-guidance.js'
      - 'weather-icons.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'scripts/capture-ui.mjs'
      - 'scripts/smoke-live.mjs'
      - 'scripts/server-truth-qa.mjs'
      - 'scripts/daily-detail-qa.mjs'
      - 'scripts/uws-location-qa.mjs'
      - 'scripts/ny-units-qa.mjs'
      - 'scripts/layout-qa.mjs'
      - '.github/workflows/screenshot-ui.yml'

permissions:
  contents: read

concurrency:
  group: weather-ui-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Wait for current release on GitHub Pages
        run: |
          EXPECTED=$(grep -o "weather-consensus-v[0-9]*" sw.js | head -1)
          echo "Waiting for live release: $EXPECTED"
          for i in $(seq 1 48); do
            LIVE=$(curl -fsS "https://jeremyhennessy.github.io/hrm-weather/sw.js?qa=$(date +%s)" || true)
            if echo "$LIVE" | grep -q "$EXPECTED"; then
              echo "GitHub Pages is serving $EXPECTED"
              exit 0
            fi
            echo "Attempt $i: live site has not reached $EXPECTED yet"
            sleep 5
          done
          echo "Timed out waiting for GitHub Pages to serve $EXPECTED"
          exit 1
      - name: Wait for Halifax locality server data
        run: |
          for i in $(seq 1 72); do
            if curl -fsS "https://jeremyhennessy.github.io/hrm-weather/data/engine-v3.json?locality=$(date +%s)" -o /tmp/engine-v3.json; then
              if python3 - <<'PY'
          import json, math
          j=json.load(open('/tmp/engine-v3.json'))
          hrm=((j.get('microclimate_intelligence') or {}).get('hrm') or {})
          points=hrm.get('points') or []
          good=(
              hrm.get('headline_blend_changed') is False
              and len(points) >= 6
              and all(isinstance(p.get('observation_temperature'), (int,float)) and math.isfinite(p['observation_temperature']) for p in points)
              and all(isinstance(p.get('observation_real_feel'), (int,float)) and math.isfinite(p['observation_real_feel']) for p in points)
          )
          raise SystemExit(0 if good else 1)
          PY
              then
                echo "Six-point Halifax ECCC locality data is live"
                exit 0
              fi
            fi
            echo "Attempt $i: waiting for regenerated Halifax locality data"
            sleep 5
          done
          echo "Timed out waiting for Halifax locality server data"
          exit 1
      - name: Capture deployed GitHub Pages UI
        env:
          WX_URL: https://jeremyhennessy.github.io/hrm-weather/app.html
        run: node scripts/capture-ui.mjs
      - name: Verify New York US-units spin
        run: node scripts/ny-units-qa.mjs
      - name: Verify live mobile startup
        run: node scripts/smoke-live.mjs
      - name: Verify live server truth ownership
        run: node scripts/server-truth-qa.mjs
      - name: Verify live daily forecast drill-down
        run: node scripts/daily-detail-qa.mjs
      - name: Verify live Upper West Side location
        run: node scripts/uws-location-qa.mjs
      - name: Check responsive UI across phone sizes
        run: node scripts/layout-qa.mjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 7
