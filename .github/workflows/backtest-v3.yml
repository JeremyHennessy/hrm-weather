name: Engine 3 retrospective backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/engine3_retro_backtest.py'
      - 'scripts/archive_backtest_v3.py'
      - 'scripts/accuracy_engine_v3.py'
      - 'scripts/accuracy_engine_v3_walkforward.py'
      - 'data/ledger.json'
      - '.github/workflows/backtest-v3.yml'

permissions:
  contents: write

concurrency:
  group: engine3-retro-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ledger and 21-day archive hindcasts
        env:
          PYTHONPATH: scripts
        run: |
          python -m py_compile scripts/engine3_retro_backtest.py scripts/archive_backtest_v3.py
          python scripts/engine3_retro_backtest.py
          python scripts/archive_backtest_v3.py
          python -m json.tool data/backtest-v3.json >/dev/null
          python -m json.tool data/archive-backtest-v3.json >/dev/null
      - name: Validate no-lookahead reports
        run: |
          python - <<'PY'
          import json
          short=json.load(open('data/backtest-v3.json'))
          archive=json.load(open('data/archive-backtest-v3.json'))
          assert short.get('leakage_policy') == 'strictly-earlier-targets-only'
          assert archive.get('leakage_policy') == 'strictly-earlier-days-only'
          assert archive.get('days_requested') == 21
          assert (archive.get('overall') or {}).get('v2',{}).get('n',0) > 20
          assert (archive.get('overall') or {}).get('engine3_reconstructed',{}).get('n',0) > 20
          print('Strict Engine 3 ledger + 21-day archive hindcasts validated')
          PY
      - name: Commit backtest reports
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest-v3.json data/archive-backtest-v3.json
          if git diff --cached --quiet; then
            echo "Backtests unchanged"
          else
            git commit -m "Update Engine 3 retrospective backtests"
            git pull --rebase origin main
            git push
          fi
