name: Apply v37 tomorrow-walk redesign

on:
  push:
    branches: [batch-card-v37]
    paths:
      - '.github/workflows/apply-v37-card.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-card-v37
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace third card with compact tomorrow strip
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('v11-reference.css'); s=p.read_text()
          start=s.index('.tomorrowRoutine{')
          end=s.index('\n.sectionHour',start)
          css=r'''.tomorrowRoutine{grid-column:1/-1!important;min-height:86px!important;display:grid!important;grid-template-columns:minmax(0,1fr) 84px 92px!important;grid-template-rows:auto auto!important;column-gap:12px!important;row-gap:3px!important;align-items:center!important;padding:12px 14px!important;border-radius:18px!important;background:linear-gradient(105deg,rgba(9,47,75,.68),rgba(4,30,50,.76))!important;box-shadow:0 10px 24px rgba(0,8,17,.13)!important;position:relative!important}.tomorrowRoutine .routineIcon{display:none!important}.tomorrowRoutine .routineTitle{grid-column:1!important;grid-row:1!important;align-self:end!important;min-width:0!important}.tomorrowRoutine .routineTitle small{font-size:8px!important;letter-spacing:.08em!important;color:#91cce4!important;white-space:nowrap!important}.tomorrowRoutine .routineTitle b{font-size:14px!important;margin-top:2px!important;line-height:1.08!important;white-space:nowrap!important}.tomorrowRoutine .routineTemps{grid-column:2!important;grid-row:1/3!important;margin:0!important;padding:0 10px!important;text-align:center!important;align-self:stretch!important;display:flex!important;flex-direction:column!important;justify-content:center!important;border-left:1px solid rgba(255,255,255,.10)!important;border-right:1px solid rgba(255,255,255,.10)!important}.tomorrowRoutine .routineTemps strong{font-size:35px!important;display:block!important;line-height:.9!important;font-weight:420!important}.tomorrowRoutine .routineTemps span{display:block!important;margin:4px 0 0!important;padding:0!important;background:transparent!important;border-radius:0!important;font-size:6.5px!important;letter-spacing:.08em!important;text-transform:uppercase!important;color:#8bdcff!important}.tomorrowRoutine .routineTemps em{display:block!important;margin-top:3px!important;font-size:8px!important;white-space:nowrap!important;color:#b9cbd5!important}.tomorrowRoutine .routineMeta{grid-column:3!important;grid-row:1/3!important;display:flex!important;flex-direction:column!important;justify-content:center!important;gap:5px!important;align-self:stretch!important;margin:0!important;font-size:8.5px!important;color:#d9e7ee!important;white-space:nowrap!important}.tomorrowRoutine .routineVerdict{grid-column:1!important;grid-row:2!important;margin:0!important;padding:0!important;border:0!important;font-size:9px!important;line-height:1.15!important;color:#eef6fa!important;white-space:normal!important;align-self:start!important}.tomorrowRoutine:after{display:none!important}@media(max-width:390px){.tomorrowRoutine{grid-template-columns:minmax(0,1fr) 76px 82px!important;column-gap:8px!important;min-height:84px!important;padding:11px 12px!important}.tomorrowRoutine .routineTitle b{font-size:13px!important}.tomorrowRoutine .routineTitle small{font-size:7.2px!important}.tomorrowRoutine .routineTemps{padding:0 7px!important}.tomorrowRoutine .routineTemps strong{font-size:32px!important}.tomorrowRoutine .routineMeta{font-size:7.8px!important}.tomorrowRoutine .routineVerdict{font-size:8.4px!important}}'''
          s=s[:start]+css+s[end:]
          p.write_text(s)
          p=Path('app.html'); s=p.read_text(); s=re.sub(r'v11-reference\.css\?v=\d+','v11-reference.css?v=37',s); p.write_text(s)
          p=Path('sw.js'); s=p.read_text(); s=re.sub(r'weather-consensus-v\d+','weather-consensus-v37',s,count=1); p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q "min-height:86px" v11-reference.css
          grep -q "weather-consensus-v37" sw.js
          grep -q "v11-reference.css?v=37" app.html
      - name: Commit
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v11-reference.css app.html sw.js
          git commit -m "Redesign next-morning walk as compact forecast strip"
          git push origin batch-card-v37
