name: Apply v36 tomorrow-card refinement

on:
  push:
    branches: [batch-card-v36]
    paths:
      - '.github/workflows/apply-v36-card.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-card-v36
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine tomorrow card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('v11-reference.css'); s=p.read_text()
          start=s.index('.tomorrowRoutine{')
          end=s.index('\n.sectionHour',start)
          css=r'''.tomorrowRoutine{grid-column:1/-1!important;min-height:104px!important;display:grid!important;grid-template-columns:minmax(142px,1fr) 76px 88px!important;grid-template-rows:auto auto!important;column-gap:8px!important;row-gap:6px!important;align-items:center!important;padding:12px 14px!important;background:linear-gradient(145deg,rgba(12,54,84,.72),rgba(4,31,52,.84))!important;position:relative!important}.tomorrowRoutine .routineIcon{display:none!important}.tomorrowRoutine .routineTitle{grid-column:1!important;grid-row:1!important;align-self:end!important;min-width:0!important}.tomorrowRoutine .routineTitle small{font-size:8px!important;letter-spacing:.07em!important;white-space:nowrap!important}.tomorrowRoutine .routineTitle b{font-size:14px!important;margin-top:3px!important;line-height:1.1!important;white-space:nowrap!important}.tomorrowRoutine .routineTemps{grid-column:2!important;grid-row:1!important;margin:0!important;padding:0!important;text-align:center!important;align-self:center!important}.tomorrowRoutine .routineTemps strong{font-size:38px!important;display:block!important;line-height:.9!important;font-weight:390!important}.tomorrowRoutine .routineTemps span{display:block!important;margin:4px auto 0!important;padding:2px 4px!important;font-size:6.5px!important;width:max-content!important}.tomorrowRoutine .routineTemps em{display:block!important;margin-top:4px!important;font-size:8px!important;white-space:nowrap!important}.tomorrowRoutine .routineMeta{grid-column:3!important;grid-row:1!important;display:flex!important;flex-direction:column!important;gap:4px!important;align-self:center!important;margin:0!important;font-size:8.5px!important;color:#d9e7ee!important;white-space:nowrap!important}.tomorrowRoutine .routineVerdict{grid-column:1/-1!important;grid-row:2!important;margin:0!important;padding:6px 0 0!important;border-top:1px solid rgba(255,255,255,.09)!important;font-size:9.5px!important;line-height:1.2!important;color:#eef6fa!important;white-space:normal!important}.tomorrowRoutine:after{display:none!important}@media(max-width:390px){.tomorrowRoutine{grid-template-columns:minmax(134px,1fr) 70px 80px!important;column-gap:6px!important;min-height:102px!important;padding:11px 12px!important}.tomorrowRoutine .routineTitle b{font-size:13px!important}.tomorrowRoutine .routineTitle small{font-size:7.4px!important}.tomorrowRoutine .routineTemps strong{font-size:35px!important}.tomorrowRoutine .routineMeta{font-size:8px!important}.tomorrowRoutine .routineVerdict{font-size:9px!important}}'''
          s=s[:start]+css+s[end:]
          p.write_text(s)
          p=Path('app.html'); s=p.read_text(); s=re.sub(r'v11-reference\.css\?v=\d+','v11-reference.css?v=36',s); p.write_text(s)
          p=Path('sw.js'); s=p.read_text(); s=re.sub(r'weather-consensus-v\d+','weather-consensus-v36',s,count=1); p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q "grid-template-columns:minmax(142px,1fr) 76px 88px" v11-reference.css
          grep -q "weather-consensus-v36" sw.js
          grep -q "v11-reference.css?v=36" app.html
      - name: Commit
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v11-reference.css app.html sw.js
          git commit -m "Refine tomorrow walk strip layout"
          git push origin batch-card-v36
