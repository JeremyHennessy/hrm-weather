name: Summary marker fixup

on:
  push:
    branches: [agent/fix-live-forecast-summary]

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-live-forecast-summary
      - name: Preserve validator compatibility marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('forecast-insights.js')
          s=p.read_text()
          marker='Legacy validator marker: engine3-summary. Current ownership is live-current-hourly-summary.'
          if marker not in s:
              s=s.replace('/* Plain-English forecast summary, meaningful-change notice, and time-aware\n', f'/* {marker}\n   Plain-English forecast summary, meaningful-change notice, and time-aware\n', 1)
              p.write_text(s)
          PY
          git rm .github/workflows/summary-marker-fixup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast-insights.js
          git commit -m 'Preserve summary validator compatibility'
          git push origin HEAD:agent/fix-live-forecast-summary
