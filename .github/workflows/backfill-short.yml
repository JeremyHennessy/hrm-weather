name: Backfill short-lead skill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-short.yml'
      - 'scripts/backfill_short.py'
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-data-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Backfill 3h 6h 12h model skill
        run: python scripts/backfill_short.py
      - name: Verify backfill produced skill data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/skill.json').read_text())
          skills=d.get('skills',{})
          if not skills:
              raise SystemExit('Backfill produced no skill records')
          leads={k.rsplit(':',1)[-1] for k in skills if not k.endswith(':all')}
          if not ({'3','6','12'} & leads):
              raise SystemExit('Backfill produced no short-lead records')
          print(f'Backfill produced {len(skills)} skill records; short leads={sorted(leads)}')
          PY
      - name: Commit shared skill data
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skill.json
          if git diff --cached --quiet; then
            echo "No skill changes"
          else
            git commit -m "Backfill short-lead forecast skill"
            git pull --rebase origin main
            git push
          fi
