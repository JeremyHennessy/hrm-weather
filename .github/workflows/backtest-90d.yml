name: Engine 3 90-day backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/archive_backtest_90d.py'
      - 'scripts/archive_backtest_90d_runner.py'
      - '.github/workflows/backtest-90d.yml'

permissions:
  contents: write

concurrency:
  group: engine3-90d-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 90-day strict hindcast
        env:
          PYTHONPATH: scripts
        run: |
          python -m py_compile scripts/archive_backtest_90d.py scripts/archive_backtest_90d_runner.py
          python scripts/archive_backtest_90d_runner.py
          python -m json.tool data/archive-backtest-90d.json >/dev/null
      - name: Validate complete causal report
        run: |
          python - <<'PY'
          import json
          j=json.load(open('data/archive-backtest-90d.json'))
          assert j.get('days_requested') == 90
          assert j.get('leakage_policy') == 'strictly-earlier-days-only'
          assert j.get('archive_success_rate') == 1.0, (j.get('archive_failures'), j.get('failure_examples'))
          assert (j.get('overall') or {}).get('v2',{}).get('n',0) > 500
          assert (j.get('overall') or {}).get('engine3_reconstructed',{}).get('n',0) > 500
          b=j.get('breakdowns') or {}
          assert b.get('by_regime') and b.get('by_season') and b.get('by_month') and b.get('by_lead') and b.get('by_location')
          print('90-day Engine 3 hindcast validated with full archive coverage')
          PY
      - name: Commit 90-day report
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive-backtest-90d.json
          if git diff --cached --quiet; then
            echo "90-day report unchanged"
          else
            git commit -m "Update 90-day Engine 3 backtest"
            git pull --rebase origin main
            git push
          fi
