name: Apply P0 final migration

on:
  push:
    branches: [p0-truth-registry-precip]
    paths:
      - '.github/workflows/apply-p0-numeric-safety.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-truth-registry-precip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final exact replacements
        run: |
          python scripts/apply_numeric_safety.py
          python scripts/apply_p0_final_migration.py
      - name: Commit migration result
        run: |
          if git diff --quiet; then
            echo 'P0 migration already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast-insights.js v5.js v6.js v6-extra.js v5b.js scripts/server-truth-qa.mjs scripts/accuracy_engine_v2.py scripts/location_uws.py scripts/accuracy_engine_v3_verify.py
          git commit -m 'Finish canonical location and truth scoring migration'
          git push origin HEAD:p0-truth-registry-precip
