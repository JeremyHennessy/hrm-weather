name: Apply UI polish once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Balance tomorrow card and slim bottom navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('v11-reference.css')
          s = css.read_text()
          start = s.index('.tomorrowRoutine{')
          end = s.index('\n.sectionHour', start)
          replacement = r'''.tomorrowRoutine{grid-column:1/-1!important;min-height:148px!important;display:grid!important;grid-template-columns:minmax(0,1fr) 178px!important;grid-template-rows:auto 1fr!important;column-gap:18px!important;row-gap:10px!important;align-items:start!important;padding:16px 18px!important;background:linear-gradient(145deg,rgba(12,54,84,.72),rgba(4,31,52,.84))!important;position:relative!important}.tomorrowRoutine .routineIcon{position:absolute!important;right:18px!important;top:15px!important;font-size:23px!important}.tomorrowRoutine .routineTitle{grid-column:1!important;grid-row:1!important;padding-right:8px!important}.tomorrowRoutine .routineTitle small{font-size:9px!important}.tomorrowRoutine .routineTitle b{font-size:16px!important;margin-top:3px!important}.tomorrowRoutine .routineTemps{grid-column:2!important;grid-row:1!important;margin:0!important;padding:27px 30px 0 0!important;text-align:left!important}.tomorrowRoutine .routineTemps strong{font-size:50px!important;display:block!important;line-height:.95!important}.tomorrowRoutine .routineTemps span{display:inline-block!important;margin:7px 0 0!important}.tomorrowRoutine .routineTemps em{display:block!important;margin-top:6px!important;font-size:10px!important}.tomorrowRoutine .routineMeta{grid-column:2!important;grid-row:2!important;display:flex!important;flex-direction:column!important;gap:4px!important;align-self:end!important;margin:0!important;font-size:10px!important}.tomorrowRoutine .routineVerdict{grid-column:1!important;grid-row:2!important;align-self:end!important;margin:0!important;padding-right:10px!important;font-size:11px!important;color:#eef6fa!important}@media(max-width:430px){.tomorrowRoutine{grid-template-columns:minmax(0,1fr) 132px!important;column-gap:11px!important;min-height:142px!important;padding:14px 15px!important}.tomorrowRoutine .routineTemps{padding:27px 20px 0 0!important}.tomorrowRoutine .routineTemps strong{font-size:44px!important}.tomorrowRoutine .routineIcon{right:14px!important;top:13px!important;font-size:20px!important}.tomorrowRoutine .routineVerdict{font-size:10px!important}.tomorrowRoutine .routineMeta{font-size:9px!important}}'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('.tomorrowRoutine{min-height:108px!important;grid-template-columns:34px minmax(0,1fr) auto!important}.tomorrowRoutine .routineTemps strong{font-size:34px!important}.tomorrowRoutine .routineMeta{display:flex!important;gap:8px!important}', '')
          css.write_text(s)

          js = Path('v11-layout.js')
          t = js.read_text()
          old = ".appNav{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:max(7px,env(safe-area-inset-bottom));width:min(620px,calc(100% - 28px));height:54px;padding:4px 6px;display:grid;grid-template-columns:repeat(5,1fr);gap:1px;border:1px solid rgba(222,242,252,.12);border-radius:18px;background:rgba(3,25,43,.74);backdrop-filter:blur(22px) saturate(125%);-webkit-backdrop-filter:blur(22px) saturate(125%);box-shadow:0 10px 30px rgba(0,8,18,.24)}.appNav button{border:0;background:transparent;color:#93aab8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;font:inherit;transition:color .16s ease,background .16s ease}.appNav button svg{width:18px;height:18px}.appNav button b{font-size:7px;font-weight:520;letter-spacing:.01em}.appNav button.active{color:#eef7fb;background:rgba(255,255,255,.075)}.appNav button.active svg{filter:none}@media(min-width:800px){.appNav{bottom:12px}}"
          new = ".appNav{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:max(7px,env(safe-area-inset-bottom));width:min(590px,calc(100% - 40px));height:46px;padding:3px 5px;display:grid;grid-template-columns:repeat(5,1fr);gap:1px;border:1px solid rgba(222,242,252,.10);border-radius:16px;background:rgba(3,25,43,.60);backdrop-filter:blur(20px) saturate(118%);-webkit-backdrop-filter:blur(20px) saturate(118%);box-shadow:0 8px 24px rgba(0,8,18,.18)}.appNav button{position:relative;border:0;background:transparent;color:#8fa8b7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:10px;font:inherit;transition:color .16s ease}.appNav button svg{width:16px;height:16px}.appNav button b{font-size:6.5px;font-weight:520;letter-spacing:.01em}.appNav button.active{color:#f1f9fc;background:transparent}.appNav button.active b{font-weight:650}.appNav button.active:after{content:\"\";position:absolute;bottom:1px;width:12px;height:2px;border-radius:2px;background:#8bdcff}.appNav button.active svg{filter:none}@media(min-width:800px){.appNav{bottom:12px}}"
          if old not in t:
              raise SystemExit('Current bottom-nav source string not found')
          js.write_text(t.replace(old,new,1))

          sw = Path('sw.js')
          w = sw.read_text()
          w = re.sub(r"weather-consensus-v\d+", "weather-consensus-v31", w, count=1)
          sw.write_text(w)
          PY
      - name: Validate edited files
        run: |
          node --check v11-layout.js
          grep -q 'grid-template-columns:minmax(0,1fr) 132px' v11-reference.css
          ! grep -q 'grid-template-columns:34px minmax(0,1fr) auto' v11-reference.css
          grep -q 'height:46px' v11-layout.js
          grep -q 'weather-consensus-v31' sw.js
      - name: Commit polish
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v11-reference.css v11-layout.js sw.js
          git commit -m "Balance next morning card and slim bottom navigation"
          git pull --rebase origin main
          git push
