name: Apply UI polish once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh presentation asset URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          s=s.replace('v11-reference.css?v=19','v11-reference.css?v=32')
          s=s.replace('v11-layout.js?v=18','v11-layout.js?v=32')
          p.write_text(s)
          PY
          grep -q 'v11-reference.css?v=32' app.html
          grep -q 'v11-layout.js?v=32' app.html
      - name: Commit refreshed asset URLs
        run: |
          git config user.name "weather-consensus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "Refresh UI presentation asset URLs"
          git pull --rebase origin main
          git push
