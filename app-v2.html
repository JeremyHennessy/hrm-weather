<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="HRM Weather"><title>HRM Weather Consensus</title><style>:root{--p:#0e2133;--l:#24445d;--t:#edf7ff;--m:#9eb8ca;--a:#73c9ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07131f,#0a1b2b 45%,#07131f);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:980px;margin:auto;padding:18px 14px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.ey{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--a);font-weight:800}h1{margin:5px 0}.sm{color:var(--m);font-size:12px}.btn{background:#17344c;color:white;border:1px solid #31546e;border-radius:13px;padding:10px 13px}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:20px}.hero{padding:20px;margin-top:18px}.temp{font-size:82px;font-weight:760;letter-spacing:-.06em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{padding:14px}.ztemp{font-size:34px;font-weight:730;margin:5px 0}.title{margin:24px 4px 10px}.hours{display:flex;gap:8px;overflow:auto}.hour{min-width:92px;text-align:center}.hour b{font-size:23px}.sources{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.warn{display:none;background:#2b191d;border-color:#70444a;margin-top:12px}@media(max-width:650px){.grid,.sources{grid-template-columns:1fr}}</style></head><body><div class="app"><header><div><div class="ey">Halifax Regional Municipality</div><h1>Weather Consensus</h1><div class="sm">Halifax Peninsula · Bedford · Dartmouth</div></div><button id="refresh" class="btn">Refresh</button></header><div id="warn" class="card warn"></div><section class="hero"><div class="ey">HRM CORE · CONSENSUS NOW</div><div id="temp" class="temp">--°</div><div id="meta" class="sm">Loading live weather feeds…</div></section><h2 class="title">Local zones</h2><section id="zones" class="grid"></section><h2 class="title">Next 12 hours</h2><section id="hours" class="hours"></section><h2 class="title">7-day outlook</h2><section id="days" class="grid"></section><h2 class="title">Model board</h2><section id="sources" class="sources"></section><div id="status" class="sm" style="margin-top:16px"></div></div><script>const Z=[['Halifax Peninsula',44.6488,-63.5752],['Bedford',44.7318,-63.6619],['Dartmouth',44.6661,-63.5676]];const M=[['best_match','Best Match','Open-Meteo blend'],['gem_seamless','GEM','Environment Canada'],['ecmwf_ifs025','ECMWF IFS','ECMWF'],['gfs_seamless','GFS','NOAA'],['icon_seamless','ICON','DWD Germany'],['ukmo_seamless','UKMO','UK Met Office'],['meteofrance_seamless','Météo-France','Météo-France'],['jma_seamless','JMA','Japan Meteorological Agency']];const avg=a=>{a=a.filter(Number.isFinite);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null},f=(x,d=1)=>Number.isFinite(x)?x.toFixed(d):'--';function idx(d){const now=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Halifax',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).format(new Date()).replace(' ','T').slice(0,13);let i=d.hourly.time.findIndex(t=>t.slice(0,13)>=now);return i<0?0:i}async function get(model,z){const best=model[0]==='best_match';let p=new URLSearchParams({latitude:z[1],longitude:z[2],timezone:'America/Halifax',forecast_days:7,current:'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m',hourly:best?'temperature_2m,precipitation_probability':'temperature_2m',daily:best?'temperature_2m_max,temperature_2m_min,precipitation_probability_max':'temperature_2m_max,temperature_2m_min',temperature_unit:'celsius',wind_speed_unit:'kmh'});if(!best)p.set('models',model[0]);let c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{let r=await fetch('https://api.open-meteo.com/v1/forecast?'+p,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json();return{model,z,data:j}}finally{clearTimeout(t)}}function render(r){if(!r.length)return;const zs=Z.map(z=>{let a=r.filter(x=>x.z[0]===z[0]),best=a.find(x=>x.model[0]==='best_match'),i=best?idx(best.data):0;return{name:z[0],temp:avg(a.map(x=>x.data.current?.temperature_2m)),feels:avg(a.map(x=>x.data.current?.apparent_temperature)),hi:avg(a.map(x=>x.data.daily?.temperature_2m_max?.[0])),lo:avg(a.map(x=>x.data.daily?.temperature_2m_min?.[0])),rain:best?.data.hourly?.precipitation_probability?.[i],n:a.length,best}});document.getElementById('temp').textContent=f(avg(zs.map(x=>x.temp)))+'°';document.getElementById('meta').textContent=`Feels ${f(avg(zs.map(x=>x.feels)))}° · ${r.length} live model/location feeds`;document.getElementById('zones').innerHTML=zs.map(x=>`<div class="card"><div class="sm">${x.name}</div><div class="ztemp">${f(x.temp)}°</div><div class="sm">Feels ${f(x.feels)}° · High ${f(x.hi)}° · Low ${f(x.lo)}° · Rain ${f(x.rain,0)}%</div></div>`).join('');let b=zs.find(x=>x.best)?.best?.data;if(b){let s=idx(b);document.getElementById('hours').innerHTML=b.hourly.time.slice(s,s+12).map((t,i)=>`<div class="card hour"><div class="sm">${new Intl.DateTimeFormat('en-CA',{hour:'numeric',timeZone:'America/Halifax'}).format(new Date(t+':00-03:00'))}</div><b>${f(b.hourly.temperature_2m[s+i],0)}°</b><div class="sm">☂ ${f(b.hourly.precipitation_probability?.[s+i],0)}%</div></div>`).join('');document.getElementById('days').innerHTML=b.daily.time.slice(0,7).map((d,i)=>`<div class="card"><div class="sm">${new Intl.DateTimeFormat('en-CA',{weekday:'short',timeZone:'America/Halifax'}).format(new Date(d+'T12:00:00-03:00'))}</div><div class="ztemp">${f(b.daily.temperature_2m_max[i],0)}°</div><div class="sm">Low ${f(b.daily.temperature_2m_min[i],0)}° · ☂ ${f(b.daily.precipitation_probability_max?.[i],0)}%</div></div>`).join('')}let rows=M.map(m=>{let a=r.filter(x=>x.model[0]===m[0]);return a.length?{m,t:avg(a.map(x=>x.data.current?.temperature_2m)),n:a.length}:null}).filter(Boolean);document.getElementById('sources').innerHTML=rows.map(x=>`<div class="card"><b>${x.m[1]}</b><div>${f(x.t)}°</div><div class="sm">${x.m[2]} · ${x.n}/3 zones</div></div>`).join('');document.getElementById('status').textContent='Updated '+new Intl.DateTimeFormat('en-CA',{dateStyle:'medium',timeStyle:'medium',timeZone:'America/Halifax'}).format(new Date())}async function load(){refresh.disabled=true;refresh.textContent='Updating…';warn.style.display='none';let first=await Promise.allSettled(Z.map(z=>get(M[0],z))),r=first.filter(x=>x.status==='fulfilled').map(x=>x.value);if(r.length)render(r);let rest=[];for(let m of M.slice(1))for(let z of Z)rest.push(get(m,z));let x=await Promise.allSettled(rest);r.push(...x.filter(y=>y.status==='fulfilled').map(y=>y.value));if(r.length)render(r);else{warn.style.display='block';warn.textContent='No weather feeds responded. Check your connection and try again.'}let fail=Z.length*M.length-r.length;if(fail&&r.length){warn.style.display='block';warn.textContent=`${fail} model/location feeds were unavailable; using ${r.length} live feeds.`}refresh.disabled=false;refresh.textContent='Refresh'}refresh.onclick=load;load();</script></body></html>
