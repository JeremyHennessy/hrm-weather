<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05213a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NY Weather Consensus">
  <title>Weather Consensus — New York</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05213a}
    #nyApp{display:block;width:100%;height:100dvh;border:0;background:#05213a}
  </style>
  <script>
    try { localStorage.setItem('wx-loc','uws'); } catch {}
  </script>
</head>
<body>
  <iframe id="nyApp" title="Weather Consensus — Upper West Side" src="./app.html?market=ny&units=us"></iframe>
  <script>
    const frame=document.getElementById('nyApp');
    frame.addEventListener('load',()=>{
      try {
        const w=frame.contentWindow,d=frame.contentDocument;
        w.localStorage.setItem('wx-loc','uws');
        const s=d.createElement('script');
        s.src='./us-units.js?v=1';
        s.dataset.wxUsUnits='1';
        d.head.appendChild(s);
      } catch(e) { console.error('NY presentation layer unavailable',e); }
    });
  </script>
</body>
</html>
